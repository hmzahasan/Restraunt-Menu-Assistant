
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Menu Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 650px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .chat-header h2 {
            margin-bottom: 6px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.85;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height:1.5;
            font-size: 14px;
            overflow-wrap: anywhere;
           
        }

        .user-message {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background: #e2e8f0;
            color: #1e293b;
            border-bottom-left-radius: 2px;
        }

        .typing {
            color: #64748b;
            font-size: 13px;
            padding: 0 20px 10px;
            display: none;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .chat-input input {
            flex: 1;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #2563eb;
        }

        .chat-input button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #1d4ed8;
        }

        .chat-input button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 500px) {
            .chat-container {
                height: 85vh;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>AI Menu Assistant</h2>
            <p>Ask me about breakfast, lunch or dinner!</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message bot-message">
<p>Hello! Welcome to AI Menu Assistant.</p>
<p>What would you like to know about today's menu?</p>
            </div>

        </div>

        <div class="typing" id="typing">
            AI is thinking...
        </div>

        <form class="chat-input" id="chatForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask about today's menu..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendButton">
                Send
            </button>

        </form>

    </div>

    <script>

        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatBox = document.getElementById('chatBox');
        const typing = document.getElementById('typing');
        const sendButton = document.getElementById('sendButton');

        // Display messages in chat
        function addMessage(message, sender) {

            const messageDiv = document.createElement('div');

            messageDiv.classList.add('message');

            if (sender === 'user') {
                messageDiv.classList.add('user-message');
            } else {
                messageDiv.classList.add('bot-message');
            }

            messageDiv.textContent = message;

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send message to backend
        chatForm.addEventListener('submit', async (e) => {

            e.preventDefault();

            const message = messageInput.value.trim();

            if (!message) return;

            // Display user message
            addMessage(message, 'user');

            messageInput.value = '';

            // Show typing indicator
            typing.style.display = 'block';

            sendButton.disabled = true;

            try {

                const response = await fetch('/chat', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(alert('Something went wrong'));
                }

                // Display AI response
                addMessage(data.reply, 'bot');

            } catch (error) {

                console.error('Error:', error);

                addMessage(
                    error.message || 'Unable to connect to the server.',
                    'bot'
                );

            } finally {

                typing.style.display = 'none';

                sendButton.disabled = false;

                messageInput.focus();

            }

        });

    </script>

</body>

</html>
